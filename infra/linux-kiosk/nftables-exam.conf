#!/usr/sbin/nft -f
# nftables-exam.conf — per-UID egress allowlist for the exam kiosk
#
# Installed to /etc/nftables.conf by setup-exam-kiosk.sh (with __EXAM_UID__ substituted).
#
# Policy:
#   - The 'exam' OS user (UID __EXAM_UID__) may ONLY reach:
#       • DNS:  port 53 UDP/TCP (so the app can resolve the API hostname)
#       • API:  port 3000 TCP   (backend)
#   - All other outbound traffic from 'exam' uid is DROPPED.
#   - All other users are NOT restricted by this ruleset (sysadmin access preserved).
#   - Inbound: only established/related connections accepted; new inbound dropped.
#
# Adjust the API_SERVER variable if your backend is on a different port.

define API_PORT = 3000
define EXAM_UID = __EXAM_UID__

table inet exam_filter {

    # ── Inbound ──────────────────────────────────────────────────────────────
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback
        iif lo accept

        # Allow established / related
        ct state established,related accept

        # Drop everything else inbound
        drop
    }

    # ── Forward (not a router, drop all) ────────────────────────────────────
    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    # ── Outbound ─────────────────────────────────────────────────────────────
    chain output {
        type filter hook output priority 0; policy accept;

        # Allow loopback
        oif lo accept

        # Allow established / related
        ct state established,related accept

        # For the exam user: whitelist only DNS + API, drop everything else
        meta skuid $EXAM_UID tcp dport $API_PORT accept  comment "exam → API server"
        meta skuid $EXAM_UID udp dport 53 accept          comment "exam → DNS"
        meta skuid $EXAM_UID tcp dport 53 accept          comment "exam → DNS (TCP)"

        # Drop all other outbound from exam user
        meta skuid $EXAM_UID drop
    }
}

