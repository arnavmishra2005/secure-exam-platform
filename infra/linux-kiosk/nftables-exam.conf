#!/usr/sbin/nft -f
# nftables-exam.conf — per-UID egress allowlist for the exam kiosk
#
# Isolated table: secure_exam_filter
# Policy:
#   - ONLY restricts outbound traffic from the dedicated 'exam' user (__EXAM_UID__).
#   - Does NOT touch inbound traffic, SSH, loopback, or any other user.
#   - Safe to apply and 100% reversible via:
#       nft delete table inet secure_exam_filter

define API_PORT = 3000
define EXAM_UID = __EXAM_UID__

table inet secure_exam_filter {
    chain exam_egress {
        type filter hook output priority 0; policy accept;

        # Bypass filter entirely for all other users (admin, everyday user, root)
        meta skuid != $EXAM_UID accept

        # Allow loopback for local testing/IPC
        oif "lo" accept

        # Allow established / related
        ct state established,related accept

        # Whitelist DNS resolution (UDP/TCP 53)
        meta skuid $EXAM_UID udp dport 53 accept comment "exam user -> DNS"
        meta skuid $EXAM_UID tcp dport 53 accept comment "exam user -> DNS (TCP)"

        # Whitelist exam API server
        meta skuid $EXAM_UID tcp dport $API_PORT accept comment "exam user -> API server"

        # Drop all other outbound traffic from the exam user
        meta skuid $EXAM_UID drop comment "block unauthorized egress for exam user"
    }
}
